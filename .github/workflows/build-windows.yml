name: build-windows

# 手动触发：GitHub 仓库 Actions 页 → build-windows → Run workflow
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install Python deps
        run: pip install -r requirements.txt pyinstaller

      - name: PyInstaller build
        run: pyinstaller --noconfirm 打包-windows.spec

      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path "dist/审计取证单生成器" -DestinationPath "审计取证单生成器-windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 审计取证单生成器-windows
          path: 审计取证单生成器-windows.zip
